; PlatformIO Project Configuration File
; ESP-Mesh-Lite + MQTT Gateway
; Version: 1.1.0
;
; Configuration:
;   1. Copy .env.example to .env and set your credentials
;   2. For per-environment overrides, create .env.{envname} files
;      Example: .env.lilygo-t3-s3-node with WIFI_SSID="WrongSSID"

[platformio]
default_envs = esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:load_env.py
lib_deps =
    knolleary/PubSubClient@^2.8
    olikraus/U8g2@^2.35

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:lilygo-t3-s3]
board = lilygo-t3-s3
build_flags =
    ${env.build_flags}
    -DDISPLAY_SDA_PIN=18
    -DDISPLAY_SCL_PIN=17
    -DERASE_NVS_ON_BOOT=1

; Root node - uses .env or .env.lilygo-t3-s3-root credentials
[env:lilygo-t3-s3-root]
board = lilygo-t3-s3
build_flags =
    ${env.build_flags}
    -DDISPLAY_SDA_PIN=18
    -DDISPLAY_SCL_PIN=17
    -DERASE_NVS_ON_BOOT=1
    -DMESH_WIFI_SOFTAP_PROTOCOL=MESH_WIFI_PROTOCOL_LR_ONLY

; Child node - uses .env.lilygo-t3-s3-node for testing (e.g., wrong SSID)
[env:lilygo-t3-s3-node]
board = lilygo-t3-s3
build_flags =
    ${env.build_flags}
    -DDISPLAY_SDA_PIN=18
    -DDISPLAY_SCL_PIN=17
    -DERASE_NVS_ON_BOOT=1
    -DMESH_WIFI_SOFTAP_PROTOCOL=MESH_WIFI_PROTOCOL_LR_ONLY
